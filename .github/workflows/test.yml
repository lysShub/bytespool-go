name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gen.outputs.go }}
    steps:
      - name: list stable go versions >= min
        id: gen
        env:
          GO_MIN_VERSION: "1.21"
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          minv = tuple(int(x) for x in os.environ["GO_MIN_VERSION"].split("."))
          req = urllib.request.Request(
              "https://go.dev/dl/?mode=json&include=all",
              headers={"User-Agent": "curl/8"},
          )
          data = json.load(urllib.request.urlopen(req))
          pat = re.compile(r"^go(\d+)\.(\d+)\.(\d+)$")
          out, seen = [], set()
          for item in data:
              if not item.get("stable"):
                  continue
              m = pat.match(item["version"])
              if not m:
                  continue
              v = tuple(map(int, m.groups()))
              if v[: len(minv)] < minv:
                  continue
              key = v[:2]
              if key in seen:
                  continue
              seen.add(key)
              out.append("%d.%d.%d" % v)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("go=%s\n" % json.dumps(out))
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/tools/cmd/goimports@v0.24.0
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.4.7
      - run: go mod tidy
      - run: staticcheck ./...
      - run: staticcheck -tags debug ./...
      - run: goimports -w .
      - run: go vet ./...
      - run: go vet -tags debug ./...
      - run: go fmt ./...
      - run: go test ./...
      - run: go test -tags debug ./...
      - run: git diff --exit-code

  test:
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ${{ fromJson(needs.versions.outputs.go) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go vet ./...
      - run: go vet -tags debug ./...
      - run: go test ./...
      - run: go test -tags debug ./...
      - run: go test -bench Benchmark_Pool -run '^$' ./...

  checks-done:
    needs: [versions, lint, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test "${{ needs.versions.result }}" = success
      - run: test "${{ needs.lint.result }}" = success
      - run: test "${{ needs.test.result }}" = success
